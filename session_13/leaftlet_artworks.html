<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Where Do Our Artworks Come From?</title>

  <!-- Load Leaflet (the 2D map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* Make the map fill the whole browser window */
    html, body, #map { width: 100%; height: 100%; margin: 0; }
    /* Size of the picture inside the popup */
    .popup-img { width: 220px; border-radius: 6px; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // STEP 1: Create the map and the base picture (tiles)
  const map = L.map("map").setView([30, 10], 2);
  L.tileLayer("https://a.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  // STEP 2: Our museum (Art Institute of Chicago)
  const MUSEUM = { name: "Art Institute of Chicago", lat: 41.88, lon: -87.62 };
  L.marker([MUSEUM.lat, MUSEUM.lon], { title: MUSEUM.name })
    .addTo(map)
    .bindPopup("<b>" + MUSEUM.name + "</b>");

  // STEP 3: Your Supabase connection details
  const SUPABASE_URL = "https://epdyvouclenzbifdnbee.supabase.co/rest/v1/artworks";
  const SUPABASE_KEY = "sb_publishable_80kBfm9ZEvssPIbbje2n6Q_LxU10p8Z";

  // STEP 4: Ask Supabase for all rows in the "artworks" table
  async function loadArtworks() {
    const response = await fetch(SUPABASE_URL + "?select=*", {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    });

    // If Supabase refuses the request, show the reason in the console (F12)
    if (!response.ok) {
      console.log("Supabase error:", await response.text());
      return;
    }

    const artworks = await response.json();

    // STEP 5: Add a marker and a line for each artwork
    artworks.forEach(art => {
      const lat = Number(art.latitude);
      const lon = Number(art.longitude);

      // The text shown in the popup (before the picture is added)
      const infoText = "<b>" + art.title + "</b><br>"
        + "Artist: " + art.artist + "<br>"
        + "Year: " + art.year + "<br>"
        + "Made in: " + art.place_name;

      // The marker where the artwork was made.
      // Leaflet wants [latitude, longitude].
      const marker = L.marker([lat, lon])
        .addTo(map)
        .bindPopup(infoText);

      // A line from the museum to the place of origin
      L.polyline([[MUSEUM.lat, MUSEUM.lon], [lat, lon]], {
        color: "gold",
        weight: 2,
        dashArray: "6 6"
      }).addTo(map);

      // STEP 6: When a student clicks the marker, search Commons for a picture
      marker.on("click", async () => {
        // Only search once per marker
        if (marker.imageLoaded) return;
        marker.imageLoaded = true;

        // Ask Wikimedia Commons for one image that matches the title and artist.
        // origin=* allows the request from a web page.
        const search = encodeURIComponent(art.title + " " + art.artist);
        const url = "https://commons.wikimedia.org/w/api.php"
          + "?action=query&generator=search"
          + "&gsrsearch=" + search
          + "&gsrnamespace=6&gsrlimit=1"
          + "&prop=imageinfo&iiprop=url&iiurlwidth=400"
          + "&format=json&origin=*";

        const response = await fetch(url);
        const data = await response.json();

        // The result is a list of pages. We asked for one, so take the first.
        const pages = data.query ? data.query.pages : null;
        const page = pages ? Object.values(pages)[0] : null;
        const info = page && page.imageinfo ? page.imageinfo[0] : null;

        if (info) {
          // Show the picture, the text, and a link to the licence page
          marker.setPopupContent(
            '<img class="popup-img" src="' + info.thumburl + '">'
            + infoText
            + '<p style="font-size:12px"><a href="' + info.descriptionurl
            + '" target="_blank">Image source and licence</a></p>'
          );
        } else {
          marker.setPopupContent(infoText + "<p><i>No image found.</i></p>");
        }
      });
    });
  }

  loadArtworks();
</script>

</body>
</html>
