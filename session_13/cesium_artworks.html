<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Where Do Our Artworks Come From?</title>

  <!-- Load CesiumJS (the 3D globe library) -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    /* Make the globe fill the whole browser window */
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<script src="config.js"></script>
<script>
  // STEP 1: Cesium access token (free account at ion.cesium.com)
  Cesium.Ion.defaultAccessToken = CESIUM_TOKEN;

  // STEP 2: Create the globe with satellite imagery and real terrain
  const viewer = new Cesium.Viewer("cesiumContainer", {
    terrain: Cesium.Terrain.fromWorldTerrain(),
    baseLayerPicker: false
  });

  // Our museum's location (Art Institute of Chicago)
  const MUSEUM = { name: "Art Institute of Chicago", lat: 41.88, lon: -87.62 };

  // STEP 3: Add the museum as a special marker
  viewer.entities.add({
    name: MUSEUM.name,
    position: Cesium.Cartesian3.fromDegrees(MUSEUM.lon, MUSEUM.lat),
    point: {
      pixelSize: 18,
      color: Cesium.Color.DEEPSKYBLUE,
      outlineColor: Cesium.Color.WHITE,
      outlineWidth: 3,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    },
    label: {
      text: MUSEUM.name,
      font: "bold 16px sans-serif",
      pixelOffset: new Cesium.Cartesian2(0, -24),
      verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
      showBackground: true,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      disableDepthTestDistance: Number.POSITIVE_INFINITY
    }
  });

  // STEP 4: Your Supabase connection details
  const SUPABASE_URL = "https://epdyvouclenzbifdnbee.supabase.co/rest/v1/artworks";
  const SUPABASE_KEY = "sb_publishable_80kBfm9ZEvssPIbbje2n6Q_LxU10p8Z";

  // STEP 5: Ask Supabase for all rows in the "artworks" table
  async function loadArtworks() {
    const response = await fetch(SUPABASE_URL + "?select=*", {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    });

    // If Supabase refuses the request, show the reason in the console (F12)
    if (!response.ok) {
      console.log("Supabase error:", await response.text());
      return;
    }

    const artworks = await response.json();

    // STEP 6: For each artwork, add a marker at its place of origin
    // and a line from the museum to that place
    artworks.forEach(art => {
      const lon = Number(art.longitude);
      const lat = Number(art.latitude);

      // The marker where the artwork was made
      viewer.entities.add({
        name: art.title,
        position: Cesium.Cartesian3.fromDegrees(lon, lat),
        point: {
          pixelSize: 12,
          color: Cesium.Color.ORANGE,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        label: {
          text: art.title,
          font: "14px sans-serif",
          pixelOffset: new Cesium.Cartesian2(0, -20),
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          showBackground: true,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        // Shown when a student clicks the marker
        description: `
          <p><b>Artist:</b> ${art.artist}<br>
          <b>Year:</b> ${art.year}<br>
          <b>Made in:</b> ${art.place_name}</p>`
      });

      // A line from the museum to the place of origin.
      // GEODESIC draws the shortest path over the curved Earth.
      viewer.entities.add({
        polyline: {
          positions: Cesium.Cartesian3.fromDegreesArray([
            MUSEUM.lon, MUSEUM.lat,
            lon, lat
          ]),
          width: 2,
          arcType: Cesium.ArcType.GEODESIC,
          material: Cesium.Color.GOLD.withAlpha(0.8)
        }
      });
    });

    // STEP 7: Fly the camera to show the museum and all the artworks
    viewer.flyTo(viewer.entities);
  }

  loadArtworks();
</script>

</body>
</html>
