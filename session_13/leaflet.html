<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple Leaflet Map</title>

  <!-- Load Leaflet (the 2D map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* Make the map fill the whole browser window */
    html, body, #map { width: 100%; height: 100%; margin: 0; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // STEP 1: Create the map, centred on Chicago, zoom level 4 (zoom 1 = whole world, 18 = street)
  const map = L.map("map").setView([41.88, -87.62], 4);

  // STEP 2: Add the base map picture (tiles) from OpenStreetMap
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  // STEP 3: Add markers. Leaflet wants latitude first, then longitude.
  L.marker([41.88, -87.62])
    .addTo(map)
    .bindPopup("Art Institute of Chicago");

  L.marker([52.01, 4.36])
    .addTo(map)
    .bindPopup("Delft, Netherlands (Vermeer)");

  L.marker([59.91, 10.75])
    .addTo(map)
    .bindPopup("Oslo, Norway (Munch)");
</script>

</body>
</html>
