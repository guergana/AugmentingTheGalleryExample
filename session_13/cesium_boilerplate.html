<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Places on a 3D Globe</title>

  <!-- Load CesiumJS (the 3D globe library) -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    /* Make the globe fill the whole browser window */
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<script>
  // STEP 1: Create the globe.
  // The base map comes from OpenStreetMap, so no Cesium account is needed.
  const viewer = new Cesium.Viewer("cesiumContainer", {
    baseLayer: new Cesium.ImageryLayer(
      new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })
    ),
    baseLayerPicker: false
  });

  // STEP 2: Your Supabase connection details
  const SUPABASE_URL = "https://epdyvouclenzbifdnbee.supabase.co/rest/v1/places";
  const SUPABASE_KEY = "sb_publishable_80kBfm9ZEvssPIbbje2n6Q_LxU10p8Z";

  // STEP 3: Ask Supabase for all rows in the "places" table
  async function loadPlaces() {
    const response = await fetch(SUPABASE_URL + "?select=*", {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }
    });

    // If Supabase refuses the request, show the reason in the console (F12)
    if (!response.ok) {
      console.log("Supabase error:", await response.text());
      return;
    }

    // The response is a list of rows, for example:
    // [{ id: 1, place_name: "Berlin", latitude: 52.52, longitude: 13.40 }, ...]
    const places = await response.json();

    // STEP 4: Add one marker with a label for each row
    places.forEach(place => {
      viewer.entities.add({
        // Cesium wants longitude first, then latitude
        position: Cesium.Cartesian3.fromDegrees(
          Number(place.longitude),
          Number(place.latitude)
        ),

        // The dot
        point: {
          pixelSize: 12,
          color: Cesium.Color.ORANGE,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2
        },

        // The name next to the dot
        label: {
          text: place.place_name,
          font: "16px sans-serif",
          pixelOffset: new Cesium.Cartesian2(0, -20),
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          showBackground: true
        }
      });
    });

    // STEP 5: Fly the camera to show all the markers
    viewer.flyTo(viewer.entities);
  }

  loadPlaces();
</script>

</body>
</html>
